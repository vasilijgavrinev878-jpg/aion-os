version: "3.9"

services:
  # ─── API Backend ──────────────────────────────────────
  api:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.api
    container_name: aion-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - LLM_DEFAULT_PROVIDER=${LLM_DEFAULT_PROVIDER:-deepseek}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../knowledge_base:/knowledge_base
      - ../.env:/app/.env
    networks:
      - aion-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Worker (background tasks) ────────────────────────
  worker:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.worker
    container_name: aion-worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../knowledge_base:/knowledge_base
    networks:
      - aion-network
    deploy:
      replicas: 2

  # ─── PostgreSQL + pgvector ────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aion-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aion}
      POSTGRES_USER: ${POSTGRES_USER:-aion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - aion-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aion} -d ${POSTGRES_DB:-aion}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aion-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - aion-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ─── LLM Server (local model via vLLM/Ollama) ─────────
  llm:
    image: vllm/vllm-openai:latest
    container_name: aion-llm
    profiles:
      - gpu
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - MODEL=${QWEN_MODEL:-qwen/qwen3-32b}
      - QUANTIZATION=${QUANTIZATION:-awq}
      - MAX_MODEL_LEN=${MAX_MODEL_LEN:-32768}
      - GPU_MEMORY_UTILIZATION=${GPU_MEMORY_UTILIZATION:-0.9}
    volumes:
      - model_cache:/root/.cache/huggingface
    networks:
      - aion-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: ["gpu"]  # Only start with --profile gpu

  # ─── Ollama (alternative local LLM) ───────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: aion-ollama
    profiles:
      - cpu
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - aion-network
    command: serve
    profiles: ["cpu"]  # Only start with --profile cpu

  # ─── Embeddings Service ────────────────────────────────
  embeddings:
    image: xenova/transformers.js:latest
    container_name: aion-embeddings
    restart: unless-stopped
    ports:
      - "8002:8001"
    environment:
      - MODEL=${EMBEDDINGS_MODEL:-BAAI/bge-m3}
    networks:
      - aion-network
    profiles: ["gpu"]

  # ─── TTS Service (Kokoro-82M) ──────────────────────────
  tts:
    build:
      context: .
      dockerfile: Dockerfile.tts
    container_name: aion-tts
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - VOICE=${TTS_VOICE:-af_bella}
    networks:
      - aion-network
    profiles: ["gpu"]

  # ─── Admin Panel (NGINX) ──────────────────────────────
  admin:
    image: nginx:alpine
    container_name: aion-admin
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../admin_panel:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - aion-network

  # ─── Prometheus (monitoring) ──────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: aion-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - aion-network
    profiles: ["monitoring"]

volumes:
  postgres_data:
  redis_data:
  model_cache:
  ollama_data:
  prometheus_data:

networks:
  aion-network:
    driver: bridge
