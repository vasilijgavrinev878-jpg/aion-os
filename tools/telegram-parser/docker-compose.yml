version: "3.8"

services:
  server:
    build: .
    container_name: aion-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - ADMIN_PASSWORD=${AION_PASSWORD:-admin123}
      - SECRET_KEY=${AION_SECRET:-change-this-in-production}
    volumes:
      - aion_data:/app/server_data
      - aion_data:/app/data
    restart: unless-stopped

volumes:
  aion_data:
