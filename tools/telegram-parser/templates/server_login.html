<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AION Invite Machine — Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0f1e;color:#e2e8f0;height:100vh;display:flex;align-items:center;justify-content:center;font-size:14px}
.login-card{background:#1e293b;border-radius:16px;padding:40px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.login-card h1{font-size:1.3rem;color:#f59e0b;margin-bottom:4px;text-align:center}
.login-card p{color:#64748b;font-size:0.82rem;margin-bottom:24px;text-align:center}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:0.78rem;color:#94a3b8;margin-bottom:4px}
.form-group input{width:100%;padding:10px 14px;border-radius:8px;border:1px solid #334155;background:#0a0f1e;color:#e2e8f0;font-size:0.95rem;outline:none;transition:.15s}
.form-group input:focus{border-color:#f59e0b}
.btn{width:100%;padding:10px;border:none;border-radius:8px;font-weight:600;font-size:0.9rem;cursor:pointer;background:#f59e0b;color:#0a0f1e;transition:.15s}
.btn:hover{background:#d97706}
.btn:disabled{opacity:.5;cursor:not-allowed}
.error{background:#450a0a;color:#ef4444;padding:8px 12px;border-radius:6px;font-size:0.82rem;margin-bottom:12px;display:none}
.logo{text-align:center;margin-bottom:16px;font-size:2rem}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">🤖</div>
  <h1>AION Invite Machine</h1>
  <p>Central Server — Admin Panel</p>
  <div id="errorBox" class="error"></div>
  <div class="form-group">
    <label>Password</label>
    <input id="password" type="password" placeholder="Enter admin password" autofocus
           onkeydown="if(event.key==='Enter')login()">
  </div>
  <button id="btnLogin" class="btn" onclick="login()">Enter</button>
</div>
<script>
async function login() {
  const pw = document.getElementById('password').value;
  if (!pw) return;
  const btn = document.getElementById('btnLogin');
  btn.disabled = true; btn.textContent = '...';
  const err = document.getElementById('errorBox');
  try {
    const r = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pw}) });
    const d = await r.json();
    if (d.ok) { window.location.href = '/'; }
    else { err.style.display='block'; err.textContent = d.error||'Wrong password'; btn.disabled=false; btn.textContent='Enter'; }
  } catch(e) {
    err.style.display='block'; err.textContent = 'Connection error'; btn.disabled=false; btn.textContent='Enter';
  }
}
</script>
</body>
</html>
