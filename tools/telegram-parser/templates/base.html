<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AION Invite Machine{% endblock %}</title>
<link rel="stylesheet" href="/static/cyberpunk.css">
{% block head %}{% endblock %}
</head>
<body>

<div class="app app-wide">
  <header class="header">
    <div class="logo">
      <span class="icon">⟁</span>
      <span>AION Invite Machine</span>
    </div>
    <span class="subtitle">v2.0 — Central Server</span>
    <div class="right">
      <span id="serverTime" class="mono" style="font-size:0.7rem;color:var(--text-muted)"></span>
      {% if session.admin %}
      <a href="/logout" class="btn btn-sm">Logout</a>
      {% endif %}
    </div>
  </header>

  {% block content %}{% endblock %}
</div>

<script>
async function api(url, opts = {}) {
  const res = await fetch(url, {
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    ...opts
  });
  if (opts.raw) return res;
  return res.json();
}

function closeModal(id) {
  document.getElementById(id)?.classList.remove('open');
}

function updateTime() {
  const el = document.getElementById('serverTime');
  if (el) el.textContent = new Date().toLocaleString();
}
setInterval(updateTime, 1000);
updateTime();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
