<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AION — Операционный дашборд</title>
<style>
:root {
  --bg: #0a0a0a;
  --bg2: #121212;
  --bg3: #1a1a1a;
  --bg4: #222;
  --text: #e0e0e0;
  --text2: #999;
  --cyan: #00e5ff;
  --pink: #ff0080;
  --green: #00e676;
  --orange: #ff9100;
  --red: #ff1744;
  --yellow: #ffea00;
  --border: #2a2a2a;
  --shadow: 0 4px 30px rgba(0,0,0,0.5);
  --glow-cyan: 0 0 20px rgba(0,229,255,0.15);
  --glow-pink: 0 0 20px rgba(255,0,128,0.1);
  --radius: 12px;
  --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #555; }

/* === HEADER === */
.header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(20px);
}
.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}
.logo {
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 4px;
  background: linear-gradient(135deg, var(--cyan), var(--pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.logo-sub {
  font-size: 11px;
  color: var(--text2);
  letter-spacing: 2px;
  text-transform: uppercase;
}
.header-center {
  display: flex;
  align-items: center;
  gap: 12px;
}
.week-btn {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 16px;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.week-btn:hover { border-color: var(--cyan); color: var(--cyan); }
.week-display {
  font-size: 14px;
  font-weight: 600;
  min-width: 160px;
  text-align: center;
  color: var(--cyan);
}
.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn {
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text);
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  transition: all 0.2s;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.btn:hover { border-color: var(--cyan); color: var(--cyan); }
.btn-primary {
  background: linear-gradient(135deg, rgba(0,229,255,0.15), rgba(255,0,128,0.15));
  border-color: var(--cyan);
  color: var(--cyan);
}
.btn-primary:hover {
  background: linear-gradient(135deg, rgba(0,229,255,0.25), rgba(255,0,128,0.25));
  box-shadow: var(--glow-cyan);
}
.btn-danger { border-color: var(--red); color: var(--red); }
.btn-danger:hover { background: rgba(255,23,68,0.1); }

/* === MAIN === */
.main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px 24px 60px;
}
.section-title {
  font-size: 13px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, var(--border), transparent);
}

/* === METRICS ROW === */
.metrics {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 32px;
}
.metric-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  position: relative;
  overflow: hidden;
  transition: all 0.3s;
}
.metric-card:hover {
  border-color: var(--cyan);
  box-shadow: var(--glow-cyan);
}
.metric-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--cyan), var(--pink));
  opacity: 0;
  transition: opacity 0.3s;
}
.metric-card:hover::before { opacity: 1; }
.metric-label {
  font-size: 10px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}
.metric-value {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: 1px;
}
.metric-value.editable-metric {
  cursor: text;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: var(--font);
  font-size: 28px;
  font-weight: 800;
  width: 100%;
  outline: none;
  padding: 0;
}
.metric-value.editable-metric:focus {
  border-bottom: 1px solid var(--cyan);
}
.metric-target {
  font-size: 11px;
  color: var(--text2);
  margin-top: 4px;
}
.metric-progress {
  margin-top: 8px;
  height: 3px;
  background: var(--bg4);
  border-radius: 2px;
  overflow: hidden;
}
.metric-progress-bar {
  height: 100%;
  border-radius: 2px;
  transition: width 0.5s;
}
.progress-cyan { background: var(--cyan); }
.progress-pink { background: var(--pink); }
.progress-green { background: var(--green); }
.progress-orange { background: var(--orange); }
.progress-yellow { background: var(--yellow); }

/* === DEPARTMENT TABS === */
.departments {
  margin-bottom: 32px;
}
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.tab {
  padding: 10px 20px;
  border-radius: 8px 8px 0 0;
  border: 1px solid var(--border);
  border-bottom: none;
  background: var(--bg2);
  color: var(--text2);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.2s;
  position: relative;
}
.tab:hover { color: var(--text); }
.tab.active {
  background: var(--bg3);
  color: var(--cyan);
  border-color: var(--cyan);
}
.tab .tab-count {
  display: inline-block;
  background: var(--bg4);
  color: var(--text2);
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 10px;
  margin-left: 6px;
}
.tab.active .tab-count {
  background: rgba(0,229,255,0.15);
  color: var(--cyan);
}
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* === TASK TABLE === */
.task-table-wrap {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.task-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.task-table th {
  background: var(--bg3);
  padding: 12px 14px;
  text-align: left;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text2);
  font-weight: 600;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  position: sticky;
  top: 0;
}
.task-table td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.task-table tr:last-child td { border-bottom: none; }
.task-table tr:hover td { background: rgba(255,255,255,0.02); }
.task-table tr.done td { opacity: 0.5; }
.task-table tr.done td:first-child::before {
  content: '✓ ';
  color: var(--green);
}

/* Editable cells */
.editable {
  cursor: text;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  width: 100%;
  outline: none;
  padding: 2px 4px;
  border-radius: 4px;
  transition: background 0.2s;
}
.editable:focus {
  background: rgba(0,229,255,0.05);
  box-shadow: 0 0 0 1px var(--cyan);
}
.editable-task { font-weight: 500; }

/* Status badge */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid transparent;
}
.status-badge:hover { filter: brightness(1.2); }
.status-pending {
  background: rgba(255,255,255,0.05);
  color: var(--text2);
  border-color: var(--border);
}
.status-in-progress {
  background: rgba(0,229,255,0.1);
  color: var(--cyan);
  border-color: var(--cyan);
}
.status-done {
  background: rgba(0,230,118,0.1);
  color: var(--green);
  border-color: var(--green);
}
.status-blocked {
  background: rgba(255,23,68,0.1);
  color: var(--red);
  border-color: var(--red);
}

/* Priority dots */
.priority-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  cursor: pointer;
}
.priority-high { background: var(--red); }
.priority-medium { background: var(--orange); }
.priority-low { background: var(--green); }

/* Remove button */
.remove-task {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  font-size: 16px;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.remove-task:hover { background: rgba(255,23,68,0.1); color: var(--red); }

/* Metric controls */
.metric-header { display: flex; align-items: center; gap: 6px; }
.metric-label-input {
  background: transparent; border: none; color: var(--text2);
  font-family: var(--font); font-size: 10px; text-transform: uppercase;
  letter-spacing: 1px; outline: none; padding: 2px 4px; border-radius: 4px;
  width: 100%; cursor: text; transition: all 0.2s;
}
.metric-label-input:focus { color: var(--text); background: rgba(255,255,255,0.05); }
.metric-del {
  width: 18px; height: 18px; border-radius: 50%; border: none;
  background: transparent; color: var(--text2); cursor: pointer;
  font-size: 10px; display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: all 0.2s; flex-shrink: 0;
}
.metric-card:hover .metric-del { opacity: 1; }
.metric-del:hover { background: rgba(255,23,68,0.2); color: var(--red); }
.add-metric-btn {
  background: var(--bg2); border: 1px dashed var(--border);
  border-radius: var(--radius); padding: 16px; display: flex;
  align-items: center; justify-content: center; cursor: pointer;
  color: var(--text2); font-size: 13px; transition: all 0.2s;
  min-height: 100px;
}
.add-metric-btn:hover { border-color: var(--cyan); color: var(--cyan); }

/* Plan metric items */
.plan-with-del { display: flex; align-items: center; gap: 6px; }
.plan-with-del .plan-item { flex: 1; }

/* Add task row */
.add-task-row td {
  padding: 8px 14px;
  background: rgba(255,255,255,0.02);
}
.add-task-input {
  background: transparent;
  border: 1px dashed var(--border);
  color: var(--text2);
  font-family: var(--font);
  font-size: 13px;
  padding: 8px 12px;
  border-radius: 6px;
  width: 100%;
  outline: none;
  transition: all 0.2s;
}
.add-task-input:focus {
  border-color: var(--cyan);
  color: var(--text);
}
.add-task-input::placeholder { color: #444; }

/* Date range inputs */
.date-range { display: flex; gap: 4px; align-items: center; }
.date-range input { width: 50%; min-width: 0; }
.date-range .date-sep { color: var(--text2); font-size: 10px; }

/* === WEEKLY PLAN === */
.weekly-plan {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 32px;
}
.plan-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
}
.plan-item {
  background: var(--bg3);
  border-radius: 8px;
  padding: 14px;
  border: 1px solid var(--border);
}
.plan-item-label {
  font-size: 10px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.plan-item-value {
  font-size: 16px;
  font-weight: 700;
}
.plan-item-value.editable {
  font-size: 16px;
  font-weight: 700;
}

/* === NOTES === */
.notes-area {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 32px;
}
.notes-editable {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  width: 100%;
  min-height: 120px;
  outline: none;
  resize: vertical;
  line-height: 1.6;
  transition: border-color 0.2s;
}
.notes-editable:focus { border-color: var(--cyan); }

/* === FOOTER === */
.footer {
  text-align: center;
  padding: 20px;
  color: var(--text2);
  font-size: 11px;
  border-top: 1px solid var(--border);
}
.footer span { color: var(--cyan); }

/* === Toast === */
.toast {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background: var(--bg3);
  border: 1px solid var(--cyan);
  border-radius: 10px;
  padding: 14px 20px;
  color: var(--cyan);
  font-size: 13px;
  box-shadow: var(--shadow), var(--glow-cyan);
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.3s;
  z-index: 999;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* === ANIME PATTERN OVERLAY === */
.anime-bg {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
  z-index: -1;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(0,229,255,0.03) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(255,0,128,0.03) 0%, transparent 50%),
    repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(255,255,255,0.005) 40px, rgba(255,255,255,0.005) 41px);
}

/* === RESPONSIVE === */
@media (max-width: 768px) {
  .header { padding: 12px 16px; }
  .header-left { gap: 10px; }
  .logo { font-size: 20px; letter-spacing: 2px; }
  .main { padding: 16px; }
  .metrics { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .metric-value, .metric-value.editable-metric { font-size: 22px; }
  .task-table-wrap { overflow-x: auto; }
  .task-table { font-size: 12px; }
  .task-table th, .task-table td { padding: 8px 10px; }
  .week-display { min-width: 100px; font-size: 12px; }
  .plan-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 480px) {
  .metrics { grid-template-columns: 1fr 1fr; }
  .header-center { order: 3; width: 100%; justify-content: center; }
}
</style>
</head>
<body>

<div class="anime-bg"></div>

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <div>
      <div class="logo">AION</div>
      <div class="logo-sub">Операционный дашборд</div>
    </div>
  </div>
  <div class="header-center">
    <button class="week-btn" onclick="prevWeek()">◀</button>
    <div class="week-display" id="weekDisplay">Неделя</div>
    <button class="week-btn" onclick="nextWeek()">▶</button>
  </div>
  <div class="header-right">
    <button class="btn" onclick="resetWeek()">Сброс</button>
    <button class="btn" onclick="exportData()">Экспорт</button>
    <button class="btn btn-primary" onclick="document.getElementById('importFile').click()">Импорт</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
  </div>
</header>

<div class="main">

  <!-- METRICS -->
  <div class="section-title">Метрики недели</div>
  <div class="metrics" id="metricsContainer"></div>

  <!-- DEPARTMENTS -->
  <div class="departments">
    <div class="tabs" id="tabsContainer"></div>
    <div id="panelsContainer"></div>
  </div>

  <!-- WEEKLY PLAN -->
  <div class="section-title">План недели</div>
  <div class="weekly-plan">
    <div class="plan-grid" id="planGrid"></div>
  </div>

  <!-- NOTES -->
  <div class="section-title">Заметки / Итоги недели</div>
  <div class="notes-area">
    <textarea class="notes-editable" id="notesField" placeholder="Итоги недели, проблемы, решения, что обсудить на следующей планерке..."></textarea>
  </div>

</div>

<div class="footer">AION <span>◈</span> 2026</div>
<div class="toast" id="toast"></div>

<script>
// ===== DATA MODEL =====
const DEPARTMENTS = [
  { id: 'b2b', name: 'B2B / Партнёры', lead: 'Люда + Дарина', color: 'cyan' },
  { id: 'media', name: 'Медиа', lead: 'Стас', color: 'pink' },
  { id: 'offline', name: 'Офлайн', lead: 'Женя + Тамила', color: 'orange' },
  { id: 'design', name: 'Дизайн', lead: 'Даша', color: 'green' },
  { id: 'tech', name: 'Техника', lead: 'Артур + Влад', color: 'yellow' }
];

const DEFAULT_METRICS = [
  { id: 'sales', label: 'Продажи', color: 'cyan' },
  { id: 'users', label: 'Пользователи', color: 'green' },
  { id: 'services', label: 'Услуги', color: 'pink' },
  { id: 'places', label: 'Места рядом', color: 'orange' },
  { id: 'bloggers', label: 'Блогеры', color: 'cyan' },
  { id: 'networkers', label: 'Сетевики', color: 'pink' },
  { id: 'offline_partners', label: 'Офлайн партнёрства', color: 'orange' }
];

const EXTRA_PLANS = [
  { id: 'plan_danang', label: 'Дананг — услуги всего', defaultValue: '50' },
  { id: 'plan_next_city', label: 'Следующий город', defaultValue: '' },
  { id: 'plan_content', label: 'Контент ежедневно', defaultValue: 'Все соцсети' }
];

const COLORS = ['cyan', 'pink', 'green', 'orange', 'yellow'];

const STATUSES = ['pending', 'in-progress', 'done', 'blocked'];
const STATUS_LABELS = { 'pending': 'Ожидает', 'in-progress': 'В работе', 'done': 'Готово', 'blocked': 'Блокер' };

// ===== STATE =====
let state = {};
let currentWeekOffset = 0;
const ANCHOR_DATE = new Date(2026, 6, 8); // 8 июля 2026 — начало отсчёта

function getWeekDates(offset) {
  const start = new Date(ANCHOR_DATE);
  start.setDate(start.getDate() + offset * 7);
  const end = new Date(start);
  end.setDate(end.getDate() + 7);
  return { start, end };
}

function getWeekId(offset) {
  const { start } = getWeekDates(offset);
  return formatDateShort(start);
}

function formatDateShort(d) {
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  return `${dd}.${mm}.${yyyy}`;
}

function formatDateRange(offset) {
  const { start, end } = getWeekDates(offset);
  return `${formatDateShort(start)} — ${formatDateShort(end)}`;
}

function loadState(weekId) {
  const saved = localStorage.getItem('aion_crm_' + weekId);
  if (saved) {
    try { return JSON.parse(saved); } catch(e) { /* fall through */ }
  }
  return null;
}

function saveState(weekId, data) {
  localStorage.setItem('aion_crm_' + weekId, JSON.stringify(data));
}

function getDefaultState() {
  const metricDefs = DEFAULT_METRICS.map(m => ({ ...m }));

  const metrics = {};
  metricDefs.forEach(m => { metrics[m.id] = 0; });

  const tasks = {};
  DEPARTMENTS.forEach(dept => {
    tasks[dept.id] = [];
  });

  const plan = {};
  metricDefs.forEach(m => { plan['target_' + m.id] = 20; });
  plan['target_sales'] = 20;
  plan['target_users'] = 800;
  plan['target_services'] = 50;
  plan['target_places'] = 140;
  plan['target_bloggers'] = 7;
  plan['target_networkers'] = 5;
  plan['target_offline_partners'] = 10;

  const extraPlans = EXTRA_PLANS.map(p => ({
    id: p.id,
    label: p.label,
    value: p.defaultValue
  }));

  return { metricDefs, metrics, tasks, plan, extraPlans, notes: '' };
}

function getState(weekId) {
  let s = loadState(weekId);
  if (!s) {
    s = getDefaultState();
    saveState(weekId, s);
  }
  let changed = false;
  if (!s.metricDefs) { s.metricDefs = DEFAULT_METRICS.map(m => ({ ...m })); changed = true; }
  s.metricDefs.forEach(m => {
    if (!(m.id in s.metrics)) { s.metrics[m.id] = 0; changed = true; }
    if (!('target_' + m.id in s.plan)) { s.plan['target_' + m.id] = 20; changed = true; }
  });
  if (!s.extraPlans) {
    s.extraPlans = EXTRA_PLANS.map(p => ({ id: p.id, label: p.label, value: s.plan[p.id] || p.defaultValue }));
    changed = true;
  }
  DEPARTMENTS.forEach(dept => {
    if (!s.tasks[dept.id]) { s.tasks[dept.id] = []; changed = true; }
  });
  if (!s.notes) { s.notes = ''; changed = true; }
  if (changed) saveState(weekId, s);
  return s;
}

// ===== RENDER =====
function render() {
  const weekId = getWeekId(currentWeekOffset);
  const range = formatDateRange(currentWeekOffset);
  document.getElementById('weekDisplay').textContent = range;

  state = getState(weekId);

  renderMetrics();
  renderTabs();
  renderPlan();
  renderNotes();

  // Activate first tab
  document.querySelectorAll('.tab')[0]?.click();
}

function renderMetrics() {
  const container = document.getElementById('metricsContainer');
  container.innerHTML = '';
  state.metricDefs.forEach(m => {
    const value = state.metrics[m.id] || 0;
    const target = state.plan['target_' + m.id] || 1;
    const pct = target > 0 ? Math.min(100, Math.round(value / target * 100)) : 0;

    const card = document.createElement('div');
    card.className = 'metric-card';
    card.innerHTML = `
      <div class="metric-header">
        <input class="metric-label-input" value="${m.label}"
          data-metric-id="${m.id}" onchange="updateMetricLabel(this)">
        <button class="metric-del" onclick="deleteMetric('${m.id}')">✕</button>
      </div>
      <input class="metric-value editable-metric" type="number" value="${value}"
        data-metric-id="${m.id}" onchange="updateMetric(this)">
      <div class="metric-target">из <strong>${target}</strong></div>
      <div class="metric-progress">
        <div class="metric-progress-bar progress-${m.color}" style="width:${pct}%"></div>
      </div>
    `;
    container.appendChild(card);
  });

  // Add button
  const addBtn = document.createElement('div');
  addBtn.className = 'add-metric-btn';
  addBtn.textContent = '+ Метрика';
  addBtn.onclick = addMetric;
  container.appendChild(addBtn);
}

function renderTabs() {
  const tabsContainer = document.getElementById('tabsContainer');
  const panelsContainer = document.getElementById('panelsContainer');
  tabsContainer.innerHTML = '';
  panelsContainer.innerHTML = '';

  DEPARTMENTS.forEach((dept, idx) => {
    const tasks = state.tasks[dept.id] || [];
    const activeCount = tasks.filter(t => t.status !== 'done').length;

    const tab = document.createElement('div');
    tab.className = 'tab' + (idx === 0 ? ' active' : '');
    tab.dataset.tab = dept.id;
    tab.innerHTML = `${dept.name} <span class="tab-count">${activeCount}</span>`;
    tab.onclick = () => switchTab(dept.id);
    tabsContainer.appendChild(tab);

    const panel = document.createElement('div');
    panel.className = 'tab-panel' + (idx === 0 ? ' active' : '');
    panel.id = 'panel-' + dept.id;
    panel.innerHTML = renderTaskTable(dept);
    panelsContainer.appendChild(panel);
  });
}

function renderTaskTable(dept) {
  const tasks = state.tasks[dept.id] || [];
  let html = `<div class="task-table-wrap"><table class="task-table">
    <thead><tr>
      <th style="width:36%">Задача</th>
      <th style="width:24%" colspan="2">Дедлайн</th>
      <th style="width:14%">Статус</th>
      <th style="width:10%">Приоритет</th>
      <th style="width:30px"></th>
    </tr></thead><tbody>`;

  tasks.forEach((task, i) => {
    const statusClass = task.status || 'pending';
    const isDone = statusClass === 'done';
    html += `<tr class="${isDone ? 'done' : ''}">
      <td><input class="editable editable-task" value="${escapeHtml(task.task || '')}"
        data-dept="${dept.id}" data-idx="${i}" data-field="task" onchange="updateTask(this)"></td>
      <td colspan="2"><div class="date-range">
        <input class="editable" value="${escapeHtml(task.dateStart || '')}"
          placeholder="дд.мм" data-dept="${dept.id}" data-idx="${i}" data-field="dateStart" onchange="updateTask(this)">
        <span class="date-sep">—</span>
        <input class="editable" value="${escapeHtml(task.dateEnd || '')}"
          placeholder="дд.мм" data-dept="${dept.id}" data-idx="${i}" data-field="dateEnd" onchange="updateTask(this)">
      </div></td>
      <td><span class="status-badge status-${statusClass}" onclick="cycleStatus('${dept.id}', ${i})">
        ${STATUS_LABELS[statusClass]}
      </span></td>
      <td><span class="priority-dot priority-${task.priority || 'medium'}"
        onclick="cyclePriority('${dept.id}', ${i})"></span></td>
      <td><button class="remove-task" onclick="removeTask('${dept.id}', ${i})">✕</button></td>
    </tr>`;
  });

  // New task row
  html += `<tr class="add-task-row"><td colspan="6">
    <input class="add-task-input" placeholder="+ Новая задача для ${dept.lead}..."
      onkeydown="addTask(event, '${dept.id}')">
  </td></tr></tbody></table></div>`;

  return html;
}

function renderPlan() {
  const grid = document.getElementById('planGrid');
  grid.innerHTML = '';
  // Targets for each metric
  state.metricDefs.forEach(m => {
    const val = state.plan['target_' + m.id] ?? '';
    const div = document.createElement('div');
    div.className = 'plan-item';
    div.innerHTML = `
      <div class="plan-item-label">План: ${escapeHtml(m.label)}</div>
      <input class="plan-item-value editable" type="number" value="${val}"
        data-plan-id="target_${m.id}" onchange="updatePlan(this)">
    `;
    grid.appendChild(div);
  });
  // Extra plan items
  state.extraPlans.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'plan-item';
    div.style.position = 'relative';
    div.innerHTML = `
      <div style="display:flex;align-items:center;gap:6px;">
        <input class="plan-item-label" style="background:transparent;border:none;color:var(--text2);font-size:10px;text-transform:uppercase;letter-spacing:1px;outline:none;width:100%;font-family:var(--font);" value="${escapeHtml(p.label)}"
          data-extra-idx="${i}" onchange="updateExtraPlanLabel(this)">
        <button style="width:18px;height:18px;border-radius:50%;border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:10px;flex-shrink:0;opacity:0.5;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.5" onclick="deleteExtraPlan(${i})">✕</button>
      </div>
      <input class="plan-item-value editable" value="${escapeHtml(p.value)}"
        data-extra-idx="${i}" onchange="updateExtraPlanValue(this)">
    `;
    grid.appendChild(div);
  });
  // Add button
  const addBtn = document.createElement('div');
  addBtn.className = 'add-metric-btn';
  addBtn.style.minHeight = '80px';
  addBtn.textContent = '+ Пункт плана';
  addBtn.onclick = addExtraPlan;
  grid.appendChild(addBtn);
}

function renderNotes() {
  document.getElementById('notesField').value = state.notes || '';
}

// ===== INTERACTIONS =====
function updateMetric(input) {
  const id = input.dataset.metricId;
  state.metrics[id] = parseInt(input.value) || 0;
  save();
  renderMetrics();
  showToast('Метрика обновлена');
}

let _metricCounter = 0;
function addMetric() {
  _metricCounter++;
  const id = 'custom_' + _metricCounter;
  const color = COLORS[_metricCounter % COLORS.length];
  state.metricDefs.push({ id, label: 'Новая метрика', color });
  state.metrics[id] = 0;
  state.plan['target_' + id] = 10;
  save();
  renderMetrics();
  renderPlan();
  showToast('Метрика добавлена');
}

function deleteMetric(id) {
  if (!confirm('Удалить метрику?')) return;
  state.metricDefs = state.metricDefs.filter(m => m.id !== id);
  delete state.metrics[id];
  delete state.plan['target_' + id];
  save();
  renderMetrics();
  renderPlan();
  showToast('Метрика удалена');
}

function updateMetricLabel(input) {
  const id = input.dataset.metricId;
  const def = state.metricDefs.find(m => m.id === id);
  if (def) { def.label = input.value; save(); }
}

function updateTask(input) {
  const deptId = input.dataset.dept;
  const idx = parseInt(input.dataset.idx);
  const field = input.dataset.field;
  if (state.tasks[deptId] && state.tasks[deptId][idx]) {
    state.tasks[deptId][idx][field] = input.value;
    save();
  }
}

function cycleStatus(deptId, idx) {
  const task = state.tasks[deptId][idx];
  if (!task) return;
  const ci = STATUSES.indexOf(task.status || 'pending');
  task.status = STATUSES[(ci + 1) % STATUSES.length];
  save();
  renderTabs();
  // Re-activate current tab
  const active = document.querySelector('.tab.active');
  if (active) switchTab(active.dataset.tab);
  showToast(`Статус: ${STATUS_LABELS[task.status]}`);
}

function cyclePriority(deptId, idx) {
  const task = state.tasks[deptId][idx];
  if (!task) return;
  const levels = ['low', 'medium', 'high'];
  const ci = levels.indexOf(task.priority || 'medium');
  task.priority = levels[(ci + 1) % levels.length];
  save();
  renderTabs();
  const active = document.querySelector('.tab.active');
  if (active) switchTab(active.dataset.tab);
}

function addTask(event, deptId) {
  if (event.key !== 'Enter') return;
  const input = event.target;
  const text = input.value.trim();
  if (!text) return;
  if (!state.tasks[deptId]) state.tasks[deptId] = [];
  state.tasks[deptId].push({
    task: text,
    dateStart: '',
    dateEnd: '',
    status: 'pending',
    priority: 'medium'
  });
  input.value = '';
  save();
  renderTabs();
  const active = document.querySelector('.tab.active');
  if (active) switchTab(active.dataset.tab);
  showToast('Задача добавлена');
}

function removeTask(deptId, idx) {
  if (!confirm('Удалить задачу?')) return;
  state.tasks[deptId].splice(idx, 1);
  save();
  renderTabs();
  const active = document.querySelector('.tab.active');
  if (active) switchTab(active.dataset.tab);
  showToast('Задача удалена');
}

function updatePlan(input) {
  state.plan[input.dataset.planId] = input.value;
  save();
}

function updateExtraPlanLabel(input) {
  const idx = parseInt(input.dataset.extraIdx);
  if (state.extraPlans[idx]) { state.extraPlans[idx].label = input.value; save(); }
}

function updateExtraPlanValue(input) {
  const idx = parseInt(input.dataset.extraIdx);
  if (state.extraPlans[idx]) { state.extraPlans[idx].value = input.value; save(); }
}

let _planCounter = 0;
function addExtraPlan() {
  _planCounter++;
  state.extraPlans.push({ id: 'extra_' + _planCounter, label: 'Новый пункт', value: '' });
  save();
  renderPlan();
  showToast('Пункт плана добавлен');
}

function deleteExtraPlan(idx) {
  if (!confirm('Удалить пункт плана?')) return;
  state.extraPlans.splice(idx, 1);
  save();
  renderPlan();
  showToast('Пункт плана удалён');
}

document.getElementById('notesField').addEventListener('input', function() {
  state.notes = this.value;
  save();
});

function switchTab(tabId) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tabId}"]`)?.classList.add('active');
  document.getElementById('panel-' + tabId)?.classList.add('active');
}

function prevWeek() { currentWeekOffset--; render(); }
function nextWeek() { currentWeekOffset++; render(); }

// ===== PERSISTENCE =====
function save() {
  const weekId = getWeekId(currentWeekOffset);
  saveState(weekId, state);
}

function resetWeek() {
  if (!confirm('Сбросить все данные этой недели?')) return;
  const weekId = getWeekId(currentWeekOffset);
  localStorage.removeItem('aion_crm_' + weekId);
  render();
  showToast('Неделя сброшена');
}

function exportData() {
  const weekId = getWeekId(currentWeekOffset);
  const data = { weekId, exported: new Date().toISOString(), state };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `AION_CRM_${weekId}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Экспорт готов');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data.state) {
        state = data.state;
        const weekId = getWeekId(currentWeekOffset);
        saveState(weekId, state);
        render();
        showToast('Импорт выполнен');
      }
    } catch(err) {
      alert('Ошибка импорта: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

// ===== INIT =====
render();
</script>
</body>
</html>
