<html>
<head><meta charset='utf-8'><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>AION — визитка</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#1a1a2e;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{max-width:380px;width:100%;background:#fff;border-radius:20px;padding:32px 24px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);position:relative}
.avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#1a1a2e,#0f3460);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:2rem;font-weight:800;color:#d4a017;border:3px solid #d4a017}
.name{font-size:1.4rem;font-weight:800;letter-spacing:1px}
.name span{color:#d4a017}
.role{font-size:0.85rem;color:#888;margin:2px 0 4px}
.loc{font-size:0.8rem;color:#aaa;margin-bottom:16px}
.badge-row{display:flex;justify-content:center;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.badge{background:#f0f0f0;border-radius:12px;padding:4px 12px;font-size:0.72rem;color:#555;font-weight:500}
.btn-group{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.btn{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;text-decoration:none;font-size:0.9rem;font-weight:600;transition:0.2s}
.btn-tg{background:#0088cc;color:#fff}
.btn-tg:hover{background:#0077b5}
.btn-wa{background:#25d366;color:#fff}
.btn-wa:hover{background:#1da851}
.btn-site{background:#1a1a2e;color:#fff}
.btn-site:hover{background:#0f0f1e}
.btn-viber{background:#7360f2;color:#fff}
.btn-viber:hover{background:#5e4ed9}
.btn .icon{font-size:1.2rem;width:24px;text-align:center}
.btn .sub{font-size:0.7rem;opacity:0.7;font-weight:400}
.actions{display:flex;gap:8px;margin-bottom:16px}
.actions .btn-action{flex:1;padding:10px;border-radius:10px;border:1px solid #ddd;background:#fff;font-size:0.8rem;font-weight:600;cursor:pointer;text-decoration:none;color:#333;display:flex;align-items:center;justify-content:center;gap:6px;transition:0.2s}
.actions .btn-action:hover{background:#f5f5f5}
.qr-box{background:#f8f8f8;border-radius:10px;padding:12px;margin-bottom:4px}
.qr-box .qr{width:80px;height:80px;background:#fff;border:1px solid #ddd;border-radius:6px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:0.55rem;color:#999;text-align:center;line-height:1.3}
.footer{font-size:0.7rem;color:#bbb;margin-top:12px}
</style>
</head><body>
<div class="card">

<div class="avatar">A</div>
<div class="name">AION <span>.</span></div>
<div class="role">Любая услуга в Азии</div>
<div class="loc">📍 Нячанг · Пхукет</div>

<div class="badge-row">
  <span class="badge">🏠 Жильё</span>
  <span class="badge">📄 Визы</span>
  <span class="badge">🚗 Транспорт</span>
  <span class="badge">🏥 Медицина</span>
  <span class="badge">💆 Красота</span>
  <span class="badge">🍽️ Еда</span>
</div>

<div class="btn-group">
  <a class="btn btn-tg" href="https://t.me/aion_asia_bot" target="_blank">
    <span class="icon">✈️</span>
    <div style="flex:1;text-align:left">Telegram<span class="sub" style="display:block">@aion_asia_bot</span></div>
  </a>
  <a class="btn btn-wa" href="https://wa.me/84901234567" target="_blank">
    <span class="icon">💬</span>
    <div style="flex:1;text-align:left">WhatsApp<span class="sub" style="display:block">Написать в чат</span></div>
  </a>
  <a class="btn btn-site" href="#">
    <span class="icon">🌐</span>
    <div style="flex:1;text-align:left">Сайт / CRM<span class="sub" style="display:block">Заказать услугу</span></div>
  </a>
</div>

<div class="actions">
  <a class="btn-action" href="https://t.me/aion_nt" target="_blank">
    <span>📢</span> Канал
  </a>
  <a class="btn-action" href="https://t.me/aion_nt_chat" target="_blank">
    <span>💬</span> Чат
  </a>
  <button class="btn-action" onclick="navigator.clipboard.writeText('https://t.me/aion_asia_bot');alert('Ссылка скопирована!')">
    <span>📋</span> Поделиться
  </button>
</div>

<div class="qr-box">
  <div class="qr">QR-код<br>на бота</div>
</div>

<div class="footer">AION · Быстро. Честно. По-русски.</div>

</div>
</body></html>
